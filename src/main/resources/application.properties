spring.application.name=fiap-soat-mecanica-billing
spring.datasource.url=${BILLING_DB_URL:jdbc:postgresql://localhost:5432/mecanica_billing}
spring.datasource.username=${BILLING_DB_USER:billing}
spring.datasource.password=${BILLING_DB_PASSWORD:}
management.endpoints.web.exposure.include=health,info
springdoc.swagger-ui.path=/swagger-ui.html
# RS256 public key of the Identity service (PEM). Without it every token is rejected.
billing.jwt.public-key=${BILLING_JWT_PUBLIC_KEY:}
billing.jwt.issuer=${BILLING_JWT_ISSUER:fiap-soat-mecanica-identity}
billing.jwt.audience=${BILLING_JWT_AUDIENCE:fiap-soat-mecanica}
# Publication of the outbox to SNS. Without the topic ARN nothing is published and no AWS client is created.
billing.eventos.topic-arn=${BILLING_EVENT_TOPIC_ARN:}
billing.outbox.intervalo-ms=${BILLING_OUTBOX_INTERVALO_MS:2000}
billing.outbox.lote=${BILLING_OUTBOX_LOTE:50}
billing.aws.region=${AWS_REGION:us-east-1}
billing.aws.endpoint=${AWS_ENDPOINT:}
billing.aws.access-key=${AWS_ACCESS_KEY_ID:}
billing.aws.secret-key=${AWS_SECRET_ACCESS_KEY:}
billing.aws.session-token=${AWS_SESSION_TOKEN:}
