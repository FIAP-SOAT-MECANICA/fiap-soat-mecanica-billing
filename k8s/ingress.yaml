# O NLB pode ser chamado direto, sem passar pelo authorizer do API Gateway. Por isso o Billing valida o JWT
# sozinho (rotas autenticadas) e o webhook valida a assinatura do Mercado Pago.
#
# /webhooks/mercadopago e chamada pelo Mercado Pago, que nao tem JWT: a rota precisa ser publica tambem no
# API Gateway, sem authorizer. Essa configuracao fica fora deste repositorio.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mecanica-billing
  namespace: mecanica
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /orcamentos
            pathType: Prefix
            backend: &billing_backend
              service:
                name: mecanica-billing
                port:
                  number: 8080
          - path: /pagamentos
            pathType: Prefix
            backend: *billing_backend
          - path: /webhooks/mercadopago
            pathType: Exact
            backend: *billing_backend
